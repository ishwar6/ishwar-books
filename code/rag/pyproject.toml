[project]
name = "rag-learning"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "fastembed>=0.8.0",
    "grandalf>=0.8",
    "httpx>=0.28.1",
    "langchain>=1.4",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.2",
    "langchain-openai>=1.6.0",
    "langchain-qdrant>=1.1.0",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.2.11",
    "langsmith>=0.12.2",
    "matplotlib>=3.11.1",
    "numpy>=2.5.3",
    "openai>=3.8.0",
    "pymupdf>=1.28.2",
    "pypdf>=6.18.0",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    "qdrant-client>=1.19.0",
    "rank-bm25>=0.2.2",
    "rich>=15.0.0",
    "scikit-learn>=1.9.0",
    "tiktoken>=0.14.0",
    "uvicorn>=0.52.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ragbook"]
