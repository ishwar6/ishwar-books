# Chapter 17 - run the WHOLE system: a Qdrant server + the API, on one private network.
#   docker compose up -d          # start both
#   docker compose logs -f api    # follow the API logs
#   docker compose down           # stop (volume keeps the vectors)
#
# Dockerfile  = how to build ONE image (the api).
# Compose     = which containers to run, how they find each other (service name = DNS name),
#               which ports/volumes/env each gets. Qdrant needs no Dockerfile: it is a stock image.
services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"     # REST + dashboard at http://localhost:6333/dashboard
      - "6334:6334"     # gRPC
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:                      # "started" is not "ready": the api waits for this to pass
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: code/ch17/Dockerfile
    ports:
      - "8000:8000"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}        # read from your shell / .env, never baked into the image
      RAG_CHAT_MODEL: ${RAG_CHAT_MODEL:-gpt-5.4-mini}
      RAG_EMBED_MODEL: ${RAG_EMBED_MODEL:-text-embedding-3-small}
      QDRANT_URL: http://qdrant:6333           # "qdrant" resolves to the container above
    depends_on:
      qdrant:
        condition: service_healthy    # otherwise the api's lifespan can start before Qdrant listens

volumes:
  qdrant_storage:
